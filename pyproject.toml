[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentloop"
version = "0.1.1"
description = "A minimal, transparent LLM agent framework with a built-in eval harness. No magic, one screen of loop logic."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Efe Cem Bardakoglu", email = "bardakogluefecem@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]
keywords = ["llm", "agents", "evals", "tool-calling", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/Efecem07/agentloop"

[tool.hatch.build.targets.wheel]
packages = ["agentloop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]